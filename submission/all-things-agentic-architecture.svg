<svg xmlns="http://www.w3.org/2000/svg" width="1920" height="1080" viewBox="0 0 1920 1080" role="img" aria-labelledby="title desc">
  <title id="title">HumanWire Google Cloud architecture</title>
  <desc id="desc">A public Cloud Run web service creates a durable Firestore run and dispatches an opaque message through Pub/Sub to an IAM-private Cloud Run worker. Google ADK and Gemini produce typed candidate decisions. HumanWire validates identity, evidence, approval, scheduling, and persistence before publishing an immutable timeline for browser polling and exports.</desc>
  <defs>
    <linearGradient id="background" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#061424"/>
      <stop offset="1" stop-color="#0b2437"/>
    </linearGradient>
    <linearGradient id="agent" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#17365b"/>
      <stop offset="1" stop-color="#122b48"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="10" stdDeviation="12" flood-color="#000" flood-opacity="0.28"/>
    </filter>
    <marker id="arrow-cyan" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#40d5ff"/>
    </marker>
    <marker id="arrow-green" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#62e6a7"/>
    </marker>
    <style>
      .heading { font: 700 54px Inter, Segoe UI, sans-serif; fill: #f7fbff; }
      .subheading { font: 400 24px Inter, Segoe UI, sans-serif; fill: #a9bdd0; }
      .lane { font: 700 19px Inter, Segoe UI, sans-serif; fill: #7ecce5; letter-spacing: 2px; }
      .title { font: 700 27px Inter, Segoe UI, sans-serif; fill: #f7fbff; }
      .body { font: 400 19px Inter, Segoe UI, sans-serif; fill: #c7d7e6; }
      .small { font: 600 16px Inter, Segoe UI, sans-serif; fill: #9fb7ca; }
      .edge { font: 600 16px Inter, Segoe UI, sans-serif; fill: #b8d7e3; }
      .node { stroke: #2c5673; stroke-width: 2; filter: url(#shadow); }
      .safe { stroke: #28bd83; stroke-width: 2; }
      .cyan-line { fill: none; stroke: #40d5ff; stroke-width: 4; marker-end: url(#arrow-cyan); }
      .green-line { fill: none; stroke: #62e6a7; stroke-width: 4; marker-end: url(#arrow-green); }
    </style>
  </defs>

  <rect width="1920" height="1080" fill="url(#background)"/>
  <circle cx="1760" cy="30" r="340" fill="#1c6d93" opacity="0.10"/>
  <circle cx="60" cy="1060" r="310" fill="#1aa876" opacity="0.08"/>

  <text x="80" y="88" class="heading">HumanWire · Durable agentic coordination</text>
  <text x="82" y="132" class="subheading">Gemini proposes. HumanWire validates authority. Google Cloud preserves every saved decision.</text>

  <text x="95" y="218" class="lane">JUDGE / DECISION OWNER</text>
  <text x="420" y="218" class="lane">PUBLIC EDGE</text>
  <text x="790" y="218" class="lane">DURABLE CONTROL PLANE</text>
  <text x="1220" y="218" class="lane">PRIVATE EXECUTION</text>
  <text x="1575" y="218" class="lane">AGENT INTELLIGENCE</text>

  <rect x="80" y="300" width="270" height="230" rx="24" fill="#102b42" class="node"/>
  <circle cx="215" cy="355" r="28" fill="#40d5ff" opacity="0.18"/>
  <path d="M198 358h34M215 341v34" stroke="#40d5ff" stroke-width="4" stroke-linecap="round"/>
  <text x="215" y="421" text-anchor="middle" class="title">Decision owner</text>
  <text x="215" y="457" text-anchor="middle" class="body">Starts one objective</text>
  <text x="215" y="487" text-anchor="middle" class="body">polls · refreshes · replays</text>

  <rect x="420" y="270" width="300" height="290" rx="24" fill="#102f48" class="node"/>
  <text x="570" y="326" text-anchor="middle" class="title">Cloud Run · web</text>
  <text x="570" y="365" text-anchor="middle" class="body">Exact same-origin API</text>
  <text x="570" y="397" text-anchor="middle" class="body">queued run before dispatch</text>
  <text x="570" y="429" text-anchor="middle" class="body">cold polling + ETag</text>
  <text x="570" y="461" text-anchor="middle" class="body">bound JSON / CSV</text>
  <rect x="468" y="493" width="204" height="42" rx="21" fill="#0b2032" stroke="#40d5ff"/>
  <text x="570" y="520" text-anchor="middle" class="small">public · scale to zero</text>

  <rect x="795" y="270" width="320" height="175" rx="24" fill="#132c45" class="node"/>
  <text x="955" y="325" text-anchor="middle" class="title">Firestore</text>
  <text x="955" y="363" text-anchor="middle" class="body">transactional ownership + lease</text>
  <text x="955" y="395" text-anchor="middle" class="body">immutable timeline + final binding</text>
  <rect x="795" y="485" width="320" height="175" rx="24" fill="#132c45" class="node"/>
  <text x="955" y="540" text-anchor="middle" class="title">Pub/Sub</text>
  <text x="955" y="578" text-anchor="middle" class="body">alias + idempotency only</text>
  <text x="955" y="610" text-anchor="middle" class="body">authenticated OIDC push</text>

  <rect x="1200" y="270" width="300" height="390" rx="24" fill="#102f48" class="node safe"/>
  <text x="1350" y="326" text-anchor="middle" class="title">Cloud Run · worker</text>
  <text x="1350" y="365" text-anchor="middle" class="body">claim before model client</text>
  <text x="1350" y="397" text-anchor="middle" class="body">heartbeat + fenced lease</text>
  <text x="1350" y="429" text-anchor="middle" class="body">bounded child execution</text>
  <text x="1350" y="461" text-anchor="middle" class="body">monotonic publication</text>
  <line x1="1246" y1="492" x2="1454" y2="492" stroke="#2b6079"/>
  <text x="1350" y="529" text-anchor="middle" class="small">IAM private</text>
  <text x="1350" y="558" text-anchor="middle" class="small">ADC service identity</text>
  <text x="1350" y="587" text-anchor="middle" class="small">concurrency 1 · max 1</text>
  <text x="1350" y="616" text-anchor="middle" class="small">no browser invocation</text>

  <rect x="1570" y="270" width="280" height="175" rx="24" fill="url(#agent)" class="node"/>
  <text x="1710" y="325" text-anchor="middle" class="title">Google ADK</text>
  <text x="1710" y="363" text-anchor="middle" class="body">coordinator + specialists</text>
  <text x="1710" y="395" text-anchor="middle" class="body">typed PersonaDecision</text>
  <rect x="1570" y="485" width="280" height="175" rx="24" fill="url(#agent)" class="node"/>
  <text x="1710" y="540" text-anchor="middle" class="title">Gemini 3.6 Flash</text>
  <text x="1710" y="578" text-anchor="middle" class="body">Vertex AI via ADC</text>
  <text x="1710" y="610" text-anchor="middle" class="body">candidate reasoning only</text>

  <path d="M350 415 H420" class="cyan-line"/>
  <text x="385" y="395" text-anchor="middle" class="edge">HTTPS</text>
  <path d="M720 345 H795" class="cyan-line"/>
  <text x="757" y="326" text-anchor="middle" class="edge">create</text>
  <path d="M720 505 H795" class="cyan-line"/>
  <text x="757" y="486" text-anchor="middle" class="edge">dispatch</text>
  <path d="M1115 572 H1200" class="green-line"/>
  <text x="1158" y="553" text-anchor="middle" class="edge">OIDC</text>
  <path d="M1500 350 H1570" class="cyan-line"/>
  <text x="1535" y="331" text-anchor="middle" class="edge">delegate</text>
  <path d="M1710 445 V485" class="cyan-line"/>
  <path d="M1570 588 C1518 588 1520 432 1500 432" class="cyan-line"/>
  <text x="1540" y="521" text-anchor="middle" class="edge" transform="rotate(-90 1540 521)">typed candidate</text>
  <path d="M1200 360 C1160 360 1168 350 1115 350" class="green-line"/>
  <text x="1158" y="332" text-anchor="middle" class="edge">claim + append</text>
  <path d="M795 317 C690 210 338 213 260 300" class="cyan-line"/>
  <text x="535" y="203" text-anchor="middle" class="edge">refresh restores the same saved prefix</text>

  <rect x="80" y="770" width="1770" height="210" rx="28" fill="#0b2032" stroke="#28bd83" stroke-width="2"/>
  <text x="125" y="828" class="title">HumanWire authority boundary</text>
  <text x="125" y="873" class="body">Identity · evidence confirmation · engagement contract · explicit approval · availability · meeting readiness</text>
  <text x="125" y="914" class="body">Model output cannot authenticate a person, approve a decision, schedule a meeting, choose a destination, or write Firestore.</text>
  <rect x="1495" y="812" width="300" height="108" rx="18" fill="#102f48" stroke="#40d5ff"/>
  <text x="1645" y="850" text-anchor="middle" class="small">ONE GATEWAY</text>
  <text x="1645" y="881" text-anchor="middle" class="body">validate → apply → persist</text>

  <text x="80" y="1033" class="small">One immutable image · least-privilege identities · no API key in cloud · rollback preserves Firestore history</text>
</svg>
