[build-system]
requires = ["setuptools>=75", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "humanwire"
version = "0.1.0"
description = "AI chief of staff for adaptive human coordination"
requires-python = ">=3.12"
dependencies = [
  "alembic>=1.16,<2",
  "caspian-sdk==0.6.1",
  "fastapi>=0.116,<1",
  "httpx>=0.28,<1",
  "jinja2>=3.1,<4",
  "pydantic>=2.11,<3",
  "pydantic-ai-slim[openai]>=1,<2",
  "pydantic-settings>=2.10,<3",
  "psycopg[binary]>=3.2,<4",
  "sqlalchemy>=2.0,<3",
  "uvicorn>=0.35,<1",
]

[project.optional-dependencies]
google = [
  "google-adk[gcp]>=2.0.0,<3.0.0",
  "google-cloud-firestore>=2.28,<3.0",
  "google-cloud-pubsub>=2.0,<3.0",
  "google-cloud-logging>=3.0,<4.0",
]
decisionos = [
  "firebase-admin>=7,<8",
]
dev = [
  "pytest>=8.4,<9",
  "pytest-asyncio>=1.1,<2",
  "ruff>=0.12,<1",
]

[project.scripts]
humanwire = "humanwire.__main__:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
humanwire = [
  "templates/*.html",
  "static/*.css",
  "static/*.js",
  "viewer_static/*.js",
  "studio_static/*.css",
  "studio_static/*.js",
  "decisionos_static/*.css",
  "decisionos_static/*.js",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["tests"]
addopts = "-q --import-mode=importlib"
markers = [
  "firestore_emulator: opt-in transaction tests against an explicit disposable emulator",
]

[tool.ruff]
line-length = 100
target-version = "py312"
